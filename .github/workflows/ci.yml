name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Show git version (GitStorage tests need it)
        run: |
          git --version
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"

      - name: Run tests
        run: pytest -q --tb=short

  smoke:
    name: Import & CLI smoke (no deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core only
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      - name: Core is importable without optional deps
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from knowflow.core.storage import StorageAdapter
          from knowflow.core.pipeline import PipelineRunner
          from knowflow.adapters.storage import create_storage, list_backends
          from knowflow.adapters.knowledge import create_knowledge, create_kb
          print('registered backends:', list_backends())
          s = create_storage('local', path='/tmp/smoke')
          s.write('a.txt', 'hi'); assert s.read('a.txt') == 'hi'
          kb = create_kb('local', path='/tmp/smoke-kb')
          print('smoke ok')
          "
      - name: CLI responds
        run: |
          python -m knowflow --help
          python -m knowflow list
